name: Validar integracion CARLOS Reserva
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis JavaScript
        run: node --check script.js
      - name: Verificar integracion V5
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const js = fs.readFileSync('script.js', 'utf8');
          assert(js.includes("frame.src=backend+'/?embed=1'"));
          assert(js.includes("window.matchMedia('(max-width:700px)')"));
          assert(js.includes('mountOfficialCalendar()'));
          assert(js.includes('event.origin!==new URL(backend).origin'));
          assert(fs.readFileSync('index.html','utf8').includes('id="cal-booking"'));
          console.log('Integración V5: OK');
          NODE
